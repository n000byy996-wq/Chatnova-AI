<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatnova</title>
    <!-- PWA / Mobilanpassning -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #111418;
            --chat-bg: #0d1117;
            --text-color: #f0f6fc;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --border-color: #21262d;
            --overlay-color: rgba(0, 0, 0, 0.5);
            --sidebar-width: 280px;
        }

        body.light {
            --bg-color: #ffffff;
            --sidebar-bg: #f0f2f5;
            --chat-bg: #ffffff;
            --text-color: #1f2328;
            --border-color: #d0d7de;
            --overlay-color: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- Overlay --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-color);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        body.sidebar-open .sidebar-overlay {
            opacity: 1;
            visibility: visible;
        }

        /* --- Sidomeny (Sidebar) --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width);
            height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }

        body.sidebar-open .sidebar {
            left: 0;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header svg {
            width: 28px;
            height: 28px;
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 4px;
        }

        .close-sidebar-btn:hover {
            opacity: 1;
        }

        .new-chat-btn {
            margin: 12px 16px;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-red));
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 2px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: rgba(240, 246, 252, 0.8);
        }

        .chat-item:hover, .chat-item.active {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
        }

        .chat-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .chat-item:hover .chat-actions {
            opacity: 0.7;
        }

        .chat-actions button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-btn {
            background: none;
            border: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .footer-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            opacity: 1;
        }

        /* --- Main Chat Area --- */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            height: 100%;
            position: relative;
            z-index: 1;
        }

        .mobile-header {
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
        }

        @media (min-width: 768px) {
            .mobile-header {
                display: none;
            }
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            margin-right: 12px;
        }

        .mobile-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-wrapper {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .message-wrapper.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-wrapper.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .avatar.user {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .avatar.bot {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-red));
            color: white;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-wrapper.user .message {
            background-color: var(--accent-blue);
            color: white;
            border-top-right-radius: 2px;
        }

        .message-wrapper.bot .message {
            background-color: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-top-left-radius: 2px;
        }

        .generated-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            display: block;
        }

        .file-download-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--accent-blue);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .file-download-link:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background-color: var(--chat-bg);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input-area input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-blue);
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease;
            padding: 0 10px;
        }

        .send-btn.active {
            opacity: 1;
        }

        /* --- Settings Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
        .modal-header h2 { font-size: 1.1rem; font-weight: 600; }
        .close-modal-btn { background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; opacity: 0.7; }

        .setting-group { display: flex; flex-direction: column; gap: 6px; }
        .setting-group label { font-size: 0.8rem; opacity: 0.8; }
        .setting-group select, .setting-group input { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); font-size: 0.9rem;}
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidomeny -->
    <div class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-header">
                <div class="logo-container">
                    <svg viewBox="0 0 512 512">
                        <defs>
                            <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#1d4ed8" />
                            </linearGradient>
                            <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ef4444" /><stop offset="100%" stop-color="#b91c1c" />
                            </linearGradient>
                        </defs>
                        <rect width="512" height="512" rx="112" fill="#161b22" />
                        <path d="M 156 170 C 156 142, 178 120, 206 120 L 306 120 C 334 120, 356 142, 356 170 L 356 270 C 356 298, 334 320, 306 320 L 260 320 L 210 370 L 210 320 L 206 320 C 178 320, 156 298, 156 270 Z" fill="url(#bGrad)" opacity="0.9" />
                        <path d="M 256 170 C 270 210, 290 230, 330 244 C 290 258, 270 278, 256 318 C 242 278, 222 258, 182 244 C 222 230, 242 210, 256 170 Z" fill="url(#rGrad)" />
                    </svg>
                    <h1>Chatnova</h1>
                </div>
                <button class="close-sidebar-btn" onclick="closeSidebar()">✕</button>
            </div>
            <button class="new-chat-btn" onclick="createNewChat()">+ Ny chatt</button>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="sidebar-footer">
            <button class="footer-btn" onclick="openSettings()">⚙️ Inställningar</button>
            <button class="footer-btn" onclick="switchAccount()">👤 Mitt konto</button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-container">
        <div class="mobile-header">
            <button class="menu-toggle-btn" onclick="openSidebar()">☰</button>
            <h2>Chatnova</h2>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message-wrapper bot">
                <div class="avatar bot">C</div>
                <div class="message">Hej! Jag är Chatnova, skapad av Blueforge studios och redforge studios. Hur kan jag hjälpa dig idag?</div>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Meddelande till Chatnova..." onkeypress="handleKeyPress(event)" oninput="toggleSendBtn()">
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Inställningar</h2>
                <button class="close-modal-btn" onclick="closeSettings()">✕</button>
            </div>
            
            <div class="setting-group">
                <label>Språk</label>
                <select id="languageSelect">
                    <option value="sv">Svenska</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Tema</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Mörkt (Standard)</option>
                    <option value="light">Ljust</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let chats = JSON.parse(localStorage.getItem('chatnova_chats')) || [{ id: Date.now(), name: "Ny chatt", messages: [] }];
        let currentChatId = chats[0].id;
        let touchstartX = 0;
        let touchendX = 0;

        const chatContainer = document.querySelector('.chat-container');

        chatContainer.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        chatContainer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            const swipeDistance = touchendX - touchstartX;
            const threshold = 70;
            if (swipeDistance > threshold && touchstartX < 100) {
                openSidebar();
            }
            if (swipeDistance < -threshold && document.body.classList.contains('sidebar-open')) {
                closeSidebar();
            }
        }

        function openSidebar() { document.body.classList.add('sidebar-open'); }
        function closeSidebar() { document.body.classList.remove('sidebar-open'); }

        function createNewChat() {
            const newChat = { id: Date.now(), name: "Ny chatt", messages: [] };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveAndRender();
            clearMessages();
            closeSidebar();
        }

        function switchChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            renderMessages(chat.messages);
            renderChatList();
            closeSidebar();
        }

        function renameChat(id) {
            const chat = chats.find(c => c.id === id);
            const newName = prompt("Byt namn på chatt:", chat.name);
            if (newName && newName.trim()) {
                chat.name = newName.trim();
                saveAndRender();
            }
        }

        function deleteChat(id) {
            if(confirm("Är du säker på att du vill radera denna chatt?")) {
                chats = chats.filter(c => c.id !== id);
                if (chats.length === 0) createNewChat();
                else if (currentChatId === id) switchChat(chats[0].id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('chatnova_chats', JSON.stringify(chats));
            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId ? 'active' : '';
                list.innerHTML += `
                    <div class="chat-item ${isActive}" onclick="switchChat(${chat.id})">
                        <span>${chat.name}</span>
                        <div class="chat-actions">
                            <button onclick="event.stopPropagation(); renameChat(${chat.id})">✏️</button>
                            <button onclick="event.stopPropagation(); deleteChat(${chat.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderMessages(messages) {
            const div = document.getElementById('chatMessages');
            div.innerHTML = '';
            if (messages.length === 0) {
                clearMessages();
                return;
            }
            messages.forEach(msg => {
                addMessageToDom(msg.sender, msg.text, msg.file, msg.imageUrl);
            });
            div.scrollTop = div.scrollHeight;
        }

        function clearMessages() {
            renderMessages([{sender: 'bot', text: 'Hej! Jag är Chatnova, skapad av Blueforge studios och redforge studios. Hur kan jag hjälpa dig idag?'}]);
        }

        function toggleSendBtn() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            if (input.value.trim()) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessageToCurrentChat('user', text);
            addMessageToDom('user', text);
            input.value = '';
            toggleSendBtn();

            setTimeout(() => {
                let reply = { sender: 'bot', text: "" };
                const lowerText = text.toLowerCase();

                // Blockering av olämpliga bildfrågor eller generella olämpliga ord
                const forbiddenWords = ["naken", "porr", "sex", "våld", "vapen", "blod", "döda", "slå", "nazi", "terror"];
                const isForbidden = forbiddenWords.some(word => lowerText.includes(word));

                if (isForbidden) {
                    reply.text = "Jag kan inte skapa eller svara på innehåll som rör våld, nakenhet eller olämpliga ämnen. Let's keep it clean och roligt istället!";
                }
                // 1. Tillåten bildgenerering
                else if (lowerText.includes("generera bild") || lowerText.includes("skapa bild") || lowerText.includes("bild på") || lowerText.includes("visa bild")) {
                    reply.text = `Här är en bild baserad på din begäran: "${text}"`;
                    const randomId = Math.floor(Math.random() * 1000);
                    reply.imageUrl = `https://picsum.photos/seed/${randomId}/500/500`;
                }
                // 2. Skaparna
                else if (lowerText.includes("vem skapade dig") || lowerText.includes("skapare") || lowerText.includes("vem är din skapare")) {
                    reply.text = "Jag är skapad av Blueforge studios och redforge studios!";
                } 
                // 3. Säkerhetsregel / Hacka
                else if (lowerText.includes("hacka") || lowerText.includes("bryta dig in")) {
                    reply.text = "Jag kan inte hjälpa till med det där. Jag är här för att hjälpa till med kreativitet, kodning, idéer och vardagsprat!";
                }
                // 4. Långt svar / 3000 rader
                else if (lowerText.includes("långt svar") || lowerText.includes("3000")) {
                    let veryLongText = "Här är början på ett väldigt långt svar...\n";
                    for(let i=1; i<=3005; i++) {
                        veryLongText += `Rad ${i}: Det här är rad nummer ${i} i det genererade svaret från Chatnova.\n`;
                    }
                    
                    const lang = document.getElementById('languageSelect').value;
                    if (lang === 'sv') {
                        reply.text = "Jag har gjort en fil för att meddelandet blev för långt, här är filen!";
                    } else {
                        reply.text = "I've created a file because the message was too long, here is the file!";
                    }

                    const blob = new Blob([veryLongText], { type: 'text/plain' });
                    reply.file = {
                        url: URL.createObjectURL(blob),
                        name: "Chatnova_Svar.txt"
                    };
                }
                // 5. Kodfrågor / Programmering
                else if (lowerText.includes("kod") || lowerText.includes("html") || lowerText.includes("javascript") || lowerText.includes("programmera")) {
                    reply.text = `Självklart kan jag hjälpa till med kod! Som en intelligent assistent skapad av Blueforge studios och redforge studios kan jag skriva och granska HTML, CSS, JavaScript och mycket mer. Vad vill du bygga eller lösa?`;
                }
                // 6. Universal / Intelligent fallback för ALLA andra ord och frågor
                else {
                    reply.text = `Jag förstår! Du frågade om "${text}". Som Chatnova (utvecklad av Blueforge studios och redforge studios) är jag här för att svara på allt mellan himmel och jord. Vill du att vi utvecklar det här vidare eller kikar på någon specifik idé?`;
                }

                addMessageToCurrentChat('bot', reply.text, reply.file, reply.imageUrl);
                addMessageToDom('bot', reply.text, reply.file, reply.imageUrl);
            }, 800);
        }

        function addMessageToCurrentChat(sender, text, file=null, imageUrl=null) {
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages.push({ sender, text, file, imageUrl });
            localStorage.setItem('chatnova_chats', JSON.stringify(chats));
        }

        function addMessageToDom(sender, text, file=null, imageUrl=null) {
            const div = document.getElementById('chatMessages');
            const avatarChar = sender === 'user' ? 'U' : 'C';
            
            let fileHtml = '';
            if (file) {
                fileHtml = `<br><a href="${file.url}" download="${file.name}" class="file-download-link">📄 Ladda ner svar (TXT)</a>`;
            }

            let imageHtml = '';
            if (imageUrl) {
                imageHtml = `<br><img src="${imageUrl}" class="generated-image" alt="Genererad bild">`;
            }

            div.innerHTML += `
                <div class="message-wrapper ${sender}">
                    <div class="avatar ${sender}">${avatarChar}</div>
                    <div class="message">${text}${imageHtml}${fileHtml}</div>
                </div>
            `;
            div.scrollTop = div.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; closeSidebar(); }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        function changeTheme(theme) {
            if (theme === 'light') document.body.classList.add('light');
            else document.body.classList.remove('light');
            localStorage.setItem('chatnova_theme', theme);
        }

        function switchAccount() { alert("Loggar ut... Byt konto."); }

        const savedTheme = localStorage.getItem('chatnova_theme');
        if (savedTheme) {
            changeTheme(savedTheme);
            document.getElementById('themeSelect').value = savedTheme;
        }

        renderChatList();
        renderMessages(chats[0].messages);
    </script>
</body>
</html>
